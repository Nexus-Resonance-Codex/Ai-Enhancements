site_name: NRC Ai-Enhancements
site_description: Institutional-grade AI scaling primitives and high-dimensional lattice memory optimization.
site_author: James Trageser
site_url: https://nexus-resonance-codex.github.io/Ai-Enhancements/
repo_url: https://github.com/Nexus-Resonance-Codex/Ai-Enhancements
use_directory_urls: false

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
  font:
    text: Outfit
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  logo: https://raw.githubusercontent.com/Nexus-Resonance-Codex/Phi-Infinity-Lattice-Compression/main/docs/assets/phi_spiral_banner.png
  favicon: https://raw.githubusercontent.com/Nexus-Resonance-Codex/Phi-Infinity-Lattice-Compression/main/docs/assets/phi_spiral_banner.png

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Nexus-Resonance-Codex/Ai-Enhancements
  status:
    new: AI-Scaling v2.2.0
  social_image: assets/images/social-preview.png

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - '🧠 Interactive Hub':
      - 'QRT Optimizer': demos/optimizer-demo.html
  - '📐 Technical Insights':
      - 'AI Enhancement Manifold': nrc-ai.md
  - '🏗 Architecture':
      - 'Resonance Shard Cache': proofs/index.md

plugins:
  - search
  - minify:
      minify_html: true

