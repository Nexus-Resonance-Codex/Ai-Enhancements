site_name: NRC Ai-Enhancements
site_description: Professional AI Scaling Primitives & Lattice Memory Optimization
site_author: James Trageser
site_url: https://Nexus-Resonance-Codex.github.io/Ai-Enhancements/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: gold
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: gold
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Interactive Demos:
      - QRT Optimizer: demos/optimizer-demo.html
  - Technical Insights:
      - AI Enhancement Manifold: nrc-ai.md
  - Architecture:
      - Resonance Shard Cache: proofs/index.md

plugins:
  - search
  - minify:
      minify_html: true
