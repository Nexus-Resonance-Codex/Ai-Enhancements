[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nrc-ai"
version = "1.0.0"
description = "Professional-Grade AI Enhancements via φ^∞ Lattice Resonance"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "CC-BY-NC-SA-4.0"}
authors = [
    {name = "James Trageser", email = "NexusResonanceCodex@gmail.com"}
]
keywords = ["nexus-resonance-codex", "pytorch", "deep-learning", "phi-infinity", "lattice-resonance", "transformers"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "transformers>=4.38.0",
    "mpmath>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
    "hypothesis>=6.98.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/nrc_ai"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "ANN", "D"]
ignore = ["D100", "D104", "ANN101", "ANN204", "ANN001", "ANN201", "ANN205", "D102", "D107", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "C901", "E722", "B018"]
"examples/*" = ["D", "ANN", "C901", "E722"]
"proofs/*" = ["D", "ANN", "C901", "E722"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
exclude = ["examples"]
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["examples.*", "tests.*", "nrc_math.*", "transformers.*"]
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nrc_ai --cov-report=term-missing --cov-fail-under=95"
