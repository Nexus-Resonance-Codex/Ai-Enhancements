# ============================================================
# nrc_ai — Python CI
# Tests NRC AI Enhancement PyTorch modules across
# Python 3.10, 3.11, 3.12, and 3.13 with the core `nrc` library.
#
# NOTE: pyproject.toml currently declares requires-python >=3.10,<3.13,
# so the 3.13 job runs as experimental (allowed to fail) until the
# metadata is widened. It does not block the ci-success gate.
# ============================================================
name: Python CI — nrc_ai library


on:
  push:
  pull_request:
  workflow_dispatch:


permissions:
  contents: read


jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            experimental: false
          - python-version: "3.11"
            experimental: false
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: true


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"


      - name: Install PyTorch CPU
        run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu


      - name: Install NRC core library
        # Upstream nrc still caps requires-python at <3.13. Ignore the cap so the
        # experimental 3.13 leg tests real compatibility instead of pip metadata.
        run: pip install --ignore-requires-python "nrc @ git+https://github.com/Nexus-Resonance-Codex/NRC.git"


      - name: Install nrc_ai and dev tools
        run: pip install -e ".[dev]"


      - name: Run tests with pytest
        run: pytest tests/ -v --tb=short
