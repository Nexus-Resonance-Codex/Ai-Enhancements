name: "Ai-Enhancements Prompt Evaluations"

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    paths:
      - '.github/prompts/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: QRT Stability Audit
        run: |
          grep -ri "QRT\|KV\|Fractal" .github/prompts/
