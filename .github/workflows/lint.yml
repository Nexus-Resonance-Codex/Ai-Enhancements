# ============================================================
# Lint — ruff check, ruff format check, and mypy type checks
# for the nrc_ai package.
# ============================================================
name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint tooling
        run: pip install ruff mypy

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy type check
        # Config comes from [tool.mypy] in pyproject.toml (lenient:
        # untyped defs allowed, missing imports ignored).
        run: mypy src/nrc_ai
